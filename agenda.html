<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c4a6e">
<meta name="description" content="Agenda operacional das obras agendadas.">
<title>Agenda de Obras</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-alltech data-pagina="agenda">
<p id="app-mensagem" class="app-mensagem" role="status" aria-live="polite"></p>
<canvas id="agenda-confete" class="agenda-confete"></canvas>
<div data-private hidden class="dashboard agenda-dashboard">
<button type="button" class="atualizar-dados" data-action="atualizar">Atualizar dados</button>
<div class="agenda-topo">
<div class="marca-cabecalho">
<img class="marca-logo" src="images/alltech-logo.png" alt="AllTech Comunicação Visual" width="1254" height="1254">
<div class="marca-texto">
<p class="agenda-eyebrow">Planejamento Operacional</p>
<h2>Agenda de Obras</h2>
<p class="agenda-subtitulo">Visualize o fluxo das proximas execucoes, prioridades e responsaveis em ordem cronologica.</p>
</div>
</div>
<button class="agenda-voltar" data-action="voltarDashboard">Voltar</button>
</div>
<div class="agenda-resumo">
<div class="agenda-metrica">
<span class="agenda-metrica-label">Obras agendadas</span>
<strong id="agenda-total">0</strong>
</div>
<div class="agenda-metrica">
<span class="agenda-metrica-label">Proxima execucao</span>
<strong id="agenda-proxima">Sem data</strong>
</div>
</div>
<div class="agenda-lista-wrap">
<div class="agenda-lista-header">
<h3>Proximas Obras</h3>
<p>Toque em um card para abrir os detalhes.</p>
</div>
<div id="lista-agenda" class="agenda-lista"></div>
</div>
<section id="alltech-agenda" class="detalhe-card"></section>
</div>
<script src="js/pwa.js"></script>
<script type="module" src="js/bootstrap.js"></script>
</body>
</html>
