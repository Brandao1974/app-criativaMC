<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c4a6e">
<meta name="description" content="Painel principal da aplicacao Gestao de Obras.">
<title>Dashboard</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-pagina="dashboard">
<p id="app-mensagem" class="app-mensagem" role="status" aria-live="polite"></p>
<div data-private hidden class="dashboard painel-dashboard">
<button type="button" class="atualizar-dados" data-action="atualizar">Atualizar dados</button>
<div class="painel-topo">
<div>
<p class="agenda-eyebrow">Central de Gestao</p>
<h2>Gestao de Obras</h2>
<p id="usuario-logado" class="usuario-logado detalhe-usuario"></p>
</div>
<button class="agenda-voltar painel-sair" data-action="logout">Sair</button>
</div>
<div class="menu painel-menu">
<button data-action="irObras">Obras</button>
<button data-action="irCaixa">Caixa</button>
<button data-action="irAgenda">Agenda</button>
</div>
<div class="painel-metricas">
<div class="resumo painel-metrica-card">
<span class="detalhe-label">Obras</span>
<p id="total-obras" class="painel-metrica-valor"></p>
</div>
<div class="resumo painel-metrica-card">
<span class="detalhe-label">Caixa</span>
<p id="caixa-total" class="painel-metrica-valor"></p>
</div>
<div class="resumo painel-metrica-card">
<span class="detalhe-label">Resultado de Caixa</span>
<p id="lucro-total" class="painel-metrica-valor"></p>
</div>
<div class="resumo painel-metrica-card">
<span class="detalhe-label">Em Andamento</span>
<p id="obras-andamento" class="painel-metrica-valor"></p>
</div>
</div>
<div class="financeiro painel-grafico-card">
<div class="detalhe-card-head">
<h3>Financeiro Geral</h3>
<p>Painel consolidado para acompanhar distribuicao de entradas e ritmo operacional.</p>
</div>
<canvas id="grafico" role="img"></canvas>
<p id="grafico-aviso" role="status"></p>
</div>
</div>
<script src="js/pwa.js"></script>
<script type="module" src="js/bootstrap.js"></script>
</body>
</html>
