<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c4a6e">
<meta name="description" content="Cadastro de obras.">
<title>Cadastrar Obra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-alltech data-pagina="cadastro">
<p id="app-mensagem" class="app-mensagem" role="status" aria-live="polite"></p>
<main data-private hidden class="dashboard obras-dashboard">
<button type="button" class="atualizar-dados" data-action="atualizar">Atualizar dados</button>
<div class="detalhe-topo">
<div class="marca-cabecalho">
<img class="marca-logo" src="images/alltech-logo.png" alt="AllTech Comunicação Visual" width="1254" height="1254">
<h1 class="marca-texto">Cadastrar Obra</h1>
</div>
<a class="agenda-voltar" href="dashboard.html">Voltar</a>
</div>
<form class="detalhe-card obra-form" data-submit="criarObra">
<label for="cliente">Cliente</label>
<input type="text" id="cliente" required>
<label for="descricao">Descrição</label>
<textarea id="descricao" rows="3"></textarea>
<label for="localizacao">Localização da obra</label>
<input type="text" id="localizacao">
<label for="cadastro-uf">UF (opcional)</label>
<select id="cadastro-uf" data-uf><option value="">Selecione</option></select>
<label for="cadastro-cidade">Cidade (opcional)</label><input id="cadastro-cidade" maxlength="120">
<label for="responsavel-loja">Responsável da loja</label>
<input type="text" id="responsavel-loja">
<label for="valor">Valor contratado (R$)</label>
<input type="number" min="0" step="0.01" id="valor">
<button type="submit" data-action="criarObra">Salvar obra</button>
</form>
</main>
<script src="js/pwa.js"></script>
<script type="module" src="js/bootstrap.js"></script>
</body>
</html>
