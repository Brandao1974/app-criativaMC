<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c4a6e">
<meta name="description" content="Controle de caixa consolidado da operacao.">
<title>Caixa</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="dashboard caixa-dashboard">
<div class="detalhe-topo">
<div>
<p class="agenda-eyebrow">Financeiro Consolidado</p>
<h2>Caixa Geral</h2>
<p class="agenda-subtitulo">Acompanhe o saldo atual e o historico completo de entradas e saidas da operacao.</p>
</div>
<button class="agenda-voltar" onclick="voltarDashboard()">Voltar</button>
</div>
<div class="caixa-resumo caixa-hero">
<span class="detalhe-label">Saldo Atual</span>
<h3 id="valor-caixa" class="caixa-valor"></h3>
</div>
<div class="movimentacoes detalhe-card">
<div class="detalhe-card-head">
<h3>Movimentacoes</h3>
<p>Lista cronologica de tudo o que entrou e saiu do caixa.</p>
</div>
<div id="lista-caixa"></div>
</div>
</div>
<script src="js/pwa.js"></script>
<script src="js/caixa.js"></script>
</body>
</html>
