<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c4a6e">
<meta name="description" content="Detalhes financeiros e operacionais da obra selecionada.">
<title>Detalhe da Obra</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="images/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96x96.png">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-alltech data-pagina="detalhe">
<p id="app-mensagem" class="app-mensagem" role="status" aria-live="polite"></p>
<main data-private hidden class="dashboard detalhe-dashboard">
<header class="detalhe-topo obra-cabecalho">
<div class="marca-cabecalho">
<img class="marca-logo" src="images/alltech-logo.png" alt="AllTech Comunicação Visual" width="1254" height="1254">
<div class="marca-texto">
<h1>Detalhe da Obra</h1>
<p id="usuario-logado" class="usuario-logado detalhe-usuario"></p>
</div>
</div>
<div class="obra-acoes">
<button type="button" class="atualizar-dados" data-action="atualizar">Atualizar dados</button>
<a class="agenda-voltar" href="obras.html">Voltar</a>
</div>
</header>
<details class="detalhe-card obra-secao">
<summary>Visão Geral <span id="obra-resumo" class="obra-resumo"></span></summary>
<div class="obra-secao-corpo">
<p id="descricao" class="detalhe-descricao"></p>
<p id="status" class="detalhe-status-pill"></p>
<dl class="detalhe-metricas obra-dados">
<div class="detalhe-metrica"><dt>Valor contratado</dt><dd id="valor"></dd></div>
<div class="detalhe-metrica"><dt>Responsável da loja</dt><dd id="responsavel-cliente"></dd></div>
<div class="detalhe-metrica"><dt>Criado por</dt><dd id="usuario-criador"></dd></div>
<div class="detalhe-metrica"><dt>Resultado de caixa</dt><dd id="lucro"></dd></div>
</dl>
<div id="alltech-detalhe"></div>
<div class="detalhe-grid">
<form class="obra-form" data-submit="alterarStatus">
<label for="novo-status">Status da obra</label>
<select id="novo-status">
<option value="Negociacao">Negociação</option>
<option value="Fechada">Fechada</option>
<option value="Em Producao">Em Produção</option>
<option value="Agendada">Agendada</option>
<option value="Em Execucao">Em Execução</option>
<option value="Finalizada">Finalizada</option>
</select>
<button type="submit" data-action="alterarStatus">Atualizar status</button>
</form>
<form class="obra-form" data-submit="agendarObra">
<label for="data-execucao">Data prevista de execução</label>
<input type="date" id="data-execucao" required>
<button type="submit" data-action="agendarObra">Salvar data</button>
</form>
</div>
</div>
</details>
<div class="detalhe-grid">
<details id="nova-entrada" class="detalhe-card obra-secao">
<summary>Nova Entrada</summary>
<form class="obra-secao-corpo obra-form" data-submit="adicionarEntrada">
<label for="descricao-entrada">Descrição</label>
<input type="text" id="descricao-entrada" required>
<label for="valor-entrada">Valor (R$)</label>
<input type="number" min="0.01" step="0.01" id="valor-entrada" required>
<button type="submit" data-action="adicionarEntrada">Salvar entrada</button>
</form>
</details>
<details id="novo-custo" class="detalhe-card obra-secao">
<summary>Novo Custo</summary>
<form class="obra-secao-corpo obra-form" data-submit="adicionarCusto">
<label for="tipo">Categoria</label>
<select id="tipo" required>
<option value="">Selecione uma categoria</option>
<option>Combustível</option>
<option>Alimentação</option>
<option>Estadia</option>
<option>Manutenção de Veículo</option>
<option>Pedágio</option>
<option>Ferro</option>
<option>ACM</option>
<option>Materiais e Insumos</option>
<option>Outros</option>
</select>
<label for="descricao-custo">Descrição do gasto</label>
<input type="text" id="descricao-custo" required>
<label for="valor-custo">Valor (R$)</label>
<input type="number" min="0.01" step="0.01" id="valor-custo" required>
<button type="submit" data-action="adicionarCusto">Salvar custo</button>
</form>
</details>
<details class="detalhe-card obra-secao">
<summary>Histórico de Entradas <span id="total-entradas" class="obra-resumo"></span></summary>
<div id="entradas" class="obra-secao-corpo"></div>
</details>
<details class="detalhe-card obra-secao">
<summary>Histórico de Custos <span id="total-custos" class="obra-resumo"></span></summary>
<div id="custos" class="obra-secao-corpo"></div>
</details>
</div>
<details class="detalhe-card obra-secao">
<summary>Histórico de Status</summary>
<div id="historico" class="obra-secao-corpo"></div>
</details>
</main>
<script src="js/pwa.js"></script>
<script type="module" src="js/bootstrap.js"></script>
</body>
</html>
